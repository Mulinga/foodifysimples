name: Deploy to Truehost
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Reinstall production-only dependencies
        run: |
          rm -rf node_modules
          bun install --production --frozen-lockfile

      - name: Package build
        run: zip -r deploy.zip .output node_modules package.json

      - name: Upload zip via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /foodifysimples/
          exclude: |
            **/*
            !deploy.zip

      - name: Extract on server via cPanel API
        run: |
          curl -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=foodifysimples/deploy.zip&destfiles=/foodifysimples&doubledecode=1&overwrite=1"

      - name: Restart app (Passenger restart signal)
        run: |
          curl -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/mkdir?path=foodifysimples&name=tmp" || true
          curl -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            --data-urlencode "dir=foodifysimples/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/save_file_content"
