name: Deploy to Truehost

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      - name: Install production-only dependencies
        run: npm ci --omit=dev

      - name: Package application
        run: zip -r deploy.zip .output node_modules package.json

      - name: Upload deployment package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /
          exclude: |
            **/*
            !deploy.zip

      - name: Extract application in cPanel
        run: |
          curl --fail-with-body -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/json-api/cpanel?cpanel_jsonapi_apiversion=2&cpanel_jsonapi_module=Fileman&cpanel_jsonapi_func=fileop&op=extract&sourcefiles=foodifysimples.com/deploy.zip&destfiles=/foodifysimples.com&doubledecode=1&overwrite=1"

      - name: Restart Node.js application
        run: |
          curl --fail-with-body -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/mkdir?path=foodifysimples.com&name=tmp" || true
          curl --fail-with-body -sk -u "${{ secrets.CPANEL_USER }}:${{ secrets.CPANEL_PASSWORD }}" \
            --data-urlencode "dir=foodifysimples.com/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/save_file_content"
